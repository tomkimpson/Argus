# Discovery reference, NANOGrav power-law model (spec C3, task 1.4).
#
# NANOGrav 15-yr hdγ / curnγ (Agazie et al. 2023): 30-mode power-law red noise per pulsar,
# a 14-mode variable-γ common process, white noise fixed at the feather dictionaries. The
# common process carries Γ(ε) = (1 − ε) I + ε Γ_HD; run_rung.py --eps sets the rung.
# Prior boxes are NANOGrav's (their Table 2 / Discovery's priordict_standard), written out
# so that nothing is inherited silently.

[Data]
data_path = /fred/oz022/tkimpson/external/discovery
n_pulsars = 67

[Model]
kernel = pl
rn_components = 30
gw_components = 14
# "variable", or a number to fix the common-process index (e.g. 4.333333333333333)
gw_gamma = variable

[PriorModel]
orf_path = fixed
red_noise_prior = flat
rn_log10_A_min = -20.0
rn_log10_A_max = -11.0
rn_gamma_min = 0.0
rn_gamma_max = 7.0
gw_log10_A_min = -18.0
gw_log10_A_max = -11.0
gw_gamma_min = 0.0
gw_gamma_max = 7.0

[NUTS]
# evidence_procedure_v1.json sampler block
num_chains = 4
num_warmup = 1000
num_samples = 1000
target_accept_prob = 0.9
max_tree_depth = 8
seed = 1501

[Output]
output_id = ng15nb_pl
