# Discovery reference, Argus's OU kernel (spec C4/C5, task 1.5).
#
# Same data, white noise, timing model and estimator as pl.ini; only the spectral shapes
# change, to Argus's integrated-OU residual PSDs (ou_psd.py, checked against the Kalman
# filter's F/Q in test/test_ng15_nb_ou_psd.py). gw_components is the ladder's mode-count
# knob: run at 14 (NANOGrav's) and 30 (task 1.5's sensitivity check).
#
# Parameters and boxes are in Argus's own sampling basis (spec C5 needs "same priors"). The
# boxes are exact uniforms here. Argus's ridge basis currently samples the common process
# through an unbounded N(0, 1) latent (parameter_sampling.py), so a matched Argus run needs an
# exact-uniform option on those two sites before it can reuse these boxes:
# - red noise: log10_gamma_p [rad/s] and log10_sigma_p [spin units], both flat. The
#   likelihood sees log10_sigma_r = log10_sigma_p - log10 f0 (data/ng15_nb/f0_catalog.json).
#   The sigma_p box is the image of NANOGrav's red-noise box log10 A in [-20, -11] at
#   gamma = 4, log10 sigma_p = log10 A + 0.5 log10(2 pi^2 f_yr / 3) + log10 f0, taken over
#   the array's f0 range (29.0 Hz, J0709+0458, to 641.9 Hz, B1937+21): [-21.9, -11.5], with the
#   lower edge rounded out to -22.
#   The gamma_p box is the MDC2 ladders' (corner frequency 1.6e-13 to 1.6e-7 Hz).
# - common process: ridge basis, log10_pivot_psd (TWO-sided PSD at 1/(5 yr), s^2/Hz) and
#   log10_gamma_a, both flat. The pivot box runs from the image of NANOGrav's
#   log10 A = -18 at gamma = 13/3 (-12.9) to 3 dex above the published amplitude (~ -6);
#   the gamma_a box is the MDC2 ladders'.

[Data]
data_path = /fred/oz022/tkimpson/external/discovery
n_pulsars = 67
f0_catalog = data/ng15_nb/f0_catalog.json

[Model]
kernel = ou
rn_components = 30
gw_components = 14

[PriorModel]
orf_path = fixed
red_noise_prior = flat
log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -22.0
log10_sigma_p_max = -11.5
log10_pivot_psd_min = -13.0
log10_pivot_psd_max = -3.0
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

[NUTS]
# evidence_procedure_v1.json sampler block
num_chains = 4
num_warmup = 1000
num_samples = 1000
target_accept_prob = 0.9
max_tree_depth = 8
seed = 1502

[Output]
output_id = ng15nb_ou14
