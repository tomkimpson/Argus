# NG15 narrowband production config v3 (spec task 5.2b, frozen 2026-11-13; supersedes v2).
#
# v2 (ng15_nb_v2.ini, frozen 2026-11-03) is kept as the record of task 5.2's second probe.
# v3 differs from v2 in the common-process ceiling and the output_id, nothing else:
# - log10_gamma_a_max -6 -> -7.0 (lever A, spec §12 2026-11-13). In the second probe γa sat
#   within 0.5 dex of -6 in 57 % of draws: at -6 the common process is f⁻² across the band,
#   so a pulsar's >30/T excess had two owners (its own OU at γp ≈ -5, or the common process)
#   and J1713+0747's red-noise state traded with γa draw by draw. At -7.0 the corner is at a
#   2-year period, so the common process is f⁻⁴ above 1/(2 yr) and cannot own a flat excess.
#   -7.0 is the dip in Argus's own γa density, below the J1713 on/off flip at -7.5…-7.2, and
#   cuts 0.1 % of Discovery's OU-14 v2 γa posterior. The init (run_array.py, mid of the box)
#   follows. Phase 1's OU reference is rerun on this box (reference/configs/ou_v3.ini).
#
# Everything below is v2's, whose notes follow:
#
# NG15 narrowband production config v2 (spec task 5.1, frozen 2026-11-03; supersedes v1).
#
# v1 (ng15_nb_v1.ini, frozen 2026-10-25) is kept as the record of task 5.2's first probe.
# v2 differs from v1 in the per-pulsar red-noise ceilings and the output_id, nothing else:
# - log10_gamma_p_max -6 -> -4 and log10_sigma_p_max -11.5 -> -10. Under v1 the probe put
#   log10_gamma_a at its -6 ceiling and 9 pulsars' γp at theirs. Discovery at 100-200
#   Fourier modes shows those pulsars carry a white-like excess above 30/T; with γp free to
#   -4 they absorb it themselves, and the low-frequency PSD moves <= 0.07 dex (spec §12,
#   2026-11-03). The γa box is unchanged, so the second probe tests whether the common
#   process then leaves its ceiling. Phase 1's OU reference is rerun on this box
#   (reference/configs/ou_v2.ini) so C5 compares like with like.
#
# Everything below is v1's, whose notes follow:
#
# Run only through workflows/ng15_nb/array/run_array.py, which swaps in the sparse
# marginal filter over the D2 compression (SparseArrayFilter) and refuses this file if
# the white-noise, timing-prior or red-noise settings below change. The stock
# run_analysis.py cannot read the compression.
#
# Built from ../../../ng15_sgwb_demo/configs/mdc2_d1_flat_uniformgw_eps000.ini (the MDC2
# 1b config after #125: diffuse timing prior, flat red noise, ridge GW basis as bounded
# uniforms, dense GW mass block). Intended differences, and nothing else:
# - data_path: the 67 NG15 narrowband ingest caches (layout: DMX-window cells, epoch cells
#   for the pulsars in results/c1/epoch_rule.json; spec D2, adopted 2026-10-19);
# - seed: fixed (spec §5);
# - log10_pivot_psd_max -5 -> -3 and the log10_sigma_p box [-20, -12] -> [-22, -11.5]:
#   the boxes of Phase 1's Discovery-OU reference (reference/configs/ou.ini), so C5
#   compares like with like. The γp box stayed [-12, -6] in v1 (spec §12, 2026-10-25);
#   v2 raises both ceilings, above;
# - noise_params_path = fixed_in_compression: per-backend EFAC/EQUAD and ECORR are
#   NANOGrav's fixed values, folded into each scalar's σ by the compression (A2); the
#   harness fixes EFAC = 1, EQUAD = 0 on top;
# - output_id.
#
# The probe of task 5.2 runs this file with only num_warmup, num_samples, the checkpoint
# interval and output_id changed (array/slurm/pilot.sh writes and diffs that copy).

[Data]
data_path = ../../data/ingest
excluded_psrs = __NONE__

[NUTS]
num_samples = 1000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 8
dense_mass = false
dense_mass_blocks = log10_pivot_psd, log10_gamma_a
seed = 1505

[PriorModel]

# 1. GW background — SAMPLED in the ridge basis (pivot log-PSD and log10 γa as bounded
# uniforms; log10 h_a derived, so its own box below is not used). Pivot f = 1/(5 yr).
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -7.0

gw_parameterization = ridge
log10_pivot_psd_min = -13.0
log10_pivot_psd_max = -3.0
gw_pivot_freq_hz = 6.3376e-09

# Correlation path held at one rung of the ladder (the pilot is the ε = 0 rung).
orf_path = fixed
orf_epsilon_value = 0.0

timing_prior = diffuse

# 2. Pulsar red noise — SAMPLED under independent exact uniforms.
spin_injections_path =
red_noise_prior = flat

log10_gamma_p_min = -12.0
log10_gamma_p_max = -4.0
log10_sigma_p_min = -22.0
log10_sigma_p_max = -10.0

# 3. White noise — FIXED inside the compression (see header).
noise_params_path = fixed_in_compression

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Checkpointing]
enabled = true
interval = 250
resume = false

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = ng15_nb_v3_eps000
base_dir = {output_id}
