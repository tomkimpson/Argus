# Argus CW Configuration
# Uses IPTA Mock Data Challenge 2, Dataset 3b (CW injection)

[Data]
# Path to the data directory (dataset_3b has a CW injection)
data_path = ../../data/IPTA_MockDataChallenge2/dataset_3b/
# Comma-separated list of pulsars to exclude from analysis
excluded_psrs = J1640+2224
# Signal model: 'gwb' for stochastic background, 'cw' for continuous wave
signal_model = cw

[NUTS]
# MCMC settings
num_samples = 200
num_warmup = 100
num_chains = 4
target_accept_prob = 0.855
max_tree_depth = 10
dense_mass = true

[CWModel]
# CW source parameters
# Injection values from group1_gw_parameters.json (dataset3):
#   f_gw = 6.1e-9 Hz -> log10 = -8.215
#   log_10_h = -13.350
#   gw_phi = 4.067 (alpha_gw = RA)
#   gw_theta = 1.431 (colatitude) -> delta_gw = pi/2 - 1.431 = 0.1398
#   inclination = 0.436 rad -> cos(0.436) = 0.907
#   phase0 = 0.175 rad
#   psi = 0.646 rad

# Strain amplitude
log10_h0_fixed = false
log10_h0_value = -13.35
log10_h0_min = -17.0
log10_h0_max = -12.0

# Source RA (radians)
alpha_gw_fixed = false
alpha_gw_value = 4.067
alpha_gw_min = 0.0
alpha_gw_max = 6.283185

# Source DEC via sin(delta) for isotropic sky coverage
# sin(0.1398) = 0.1395
sin_delta_gw_fixed = false
sin_delta_gw_value = 0.1395
sin_delta_gw_min = -1.0
sin_delta_gw_max = 1.0
# Used when sin_delta_gw is fixed - direct delta value
delta_gw_value = 0.1398

# GW frequency
log10_f_gw_fixed = false
log10_f_gw_value = -8.215
log10_f_gw_min = -9.0
log10_f_gw_max = -7.0

# Inclination (cosine)
cos_iota_fixed = false
cos_iota_value = 0.907
cos_iota_min = -1.0
cos_iota_max = 1.0

# Polarization angle (radians)
psi_fixed = false
psi_value = 0.646
psi_min = 0.0
psi_max = 3.14159

# Initial phase (radians)
Phi0_fixed = false
Phi0_value = 0.175
Phi0_min = 0.0
Phi0_max = 6.283185

[PriorModel]
# Pulsar red noise parameters (same as GWB mode)

# Pulsar red noise parameters - simplified ranges
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# Hierarchical modeling hyperpriors
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

# Log-ratio parameterization
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# EFAC/EQUAD parameters
efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

# GW background parameters (not used in CW mode but required for PriorModel section)
log10_ha_fixed = true
log10_ha_value = -15.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = outputs/
output_id = results_cw
base_dir = {output_id}
