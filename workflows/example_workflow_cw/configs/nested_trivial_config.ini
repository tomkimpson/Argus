# Trivial jaxns test — only 2 free CW params (h0, f_gw), everything else fixed
# Purpose: verify jaxns compilation, output format, and evidence computation

[Data]
data_path = ../../data/IPTA_MockDataChallenge2/dataset_3b/
excluded_psrs = J1640+2224
signal_model = cw
sampler = nested

[NestedSampler]
max_samples = 5000
num_live_points = 200
s = 3
k = 0
num_posterior_samples = 2000

[NUTS]
num_samples = 100
num_warmup = 50
num_chains = 1

[CWModel]
include_pulsar_term = false
phase_parameterization = false

log10_h0_fixed = false
log10_h0_min = -16.0
log10_h0_max = -12.0

alpha_gw_fixed = true
alpha_gw_value = 4.067

sin_delta_gw_fixed = true
sin_delta_gw_value = 0.1395
delta_gw_value = 0.1399

log10_f_gw_fixed = false
log10_f_gw_min = -9.0
log10_f_gw_max = -7.0

cos_iota_fixed = true
cos_iota_value = 0.907

psi_fixed = true
psi_value = 0.646

Phi0_fixed = true
Phi0_value = 0.175

[PriorModel]
log10_ha_fixed = true
log10_ha_value = -15.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json
spin_injections_path = dummy_spin_injections.pkl

log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0
efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = outputs/
output_id = cw_nested_trivial
base_dir = {output_id}
