# CW inference with replica exchange MCMC v4
# Vousden et al. (2016) adaptive temperature ladder
# Starts from geometric spacing, then adapts online to equalize swap rates
# Uses same beta_hot=0.1 as v3 (T_max=10) with 12 chains

[Data]
data_path = ../../data/IPTA_MockDataChallenge2/dataset_3b/
excluded_psrs = J1640+2224
signal_model = cw
sampler = replica_exchange

[ReplicaExchange]
num_chains = 12
num_samples = 5000
num_warmup = 500
num_hmc_steps = 5
num_integration_steps = 10
beta_hot = 0.1
beta_spacing = adaptive
step_size = -1.0
thin = 1
seed = 42

[CWModel]
include_pulsar_term = true
phase_parameterization = true

log10_h0_fixed = false
log10_h0_min = -16.0
log10_h0_max = -12.0

alpha_gw_fixed = false
alpha_gw_min = 0.0
alpha_gw_max = 6.283185

sin_delta_gw_fixed = false
sin_delta_gw_min = -1.0
sin_delta_gw_max = 1.0
delta_gw_value = 0.0

log10_f_gw_fixed = false
log10_f_gw_min = -9.0
log10_f_gw_max = -7.0

cos_iota_fixed = false
cos_iota_min = -1.0
cos_iota_max = 1.0

psi_fixed = false
psi_min = 0.0
psi_max = 3.14159

Phi0_fixed = false
Phi0_min = 0.0
Phi0_max = 6.283185

[PriorModel]
log10_ha_fixed = true
log10_ha_value = -15.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0
efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = outputs/
output_id = cw_replica_exchange_v4
base_dir = {output_id}
