# CW Smoke Test Configuration
# Minimal settings to verify the pipeline runs end-to-end
# Uses fixed noise parameters for speed

[Data]
data_path = ../../data/IPTA_MockDataChallenge2/dataset_3b/
excluded_psrs = J1640+2224
signal_model = cw

[NUTS]
# Minimal MCMC settings for smoke test
num_samples = 10
num_warmup = 10
num_chains = 1
target_accept_prob = 0.8
max_tree_depth = 5
dense_mass = false

[CWModel]
# Fix most CW params to injection values, only sample h0 and f_gw
# This makes the smoke test fast (2 free CW params instead of 7)

# Strain amplitude - SAMPLE
log10_h0_fixed = false
log10_h0_min = -15.0
log10_h0_max = -12.0

# Source RA - FIXED to injection
alpha_gw_fixed = true
alpha_gw_value = 4.067

# Source DEC - FIXED to injection
sin_delta_gw_fixed = true
sin_delta_gw_value = 0.1395
delta_gw_value = 0.1398

# GW frequency - SAMPLE
log10_f_gw_fixed = false
log10_f_gw_min = -8.5
log10_f_gw_max = -7.9

# Inclination - FIXED
cos_iota_fixed = true
cos_iota_value = 0.907

# Polarization - FIXED
psi_fixed = true
psi_value = 0.646

# Phase - FIXED
Phi0_fixed = true
Phi0_value = 0.175

[PriorModel]
# GW background (not used in CW mode but section keys needed)
log10_ha_fixed = true
log10_ha_value = -15.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

# Fix EFAC/EQUAD from noise parameters file
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

# Pulsar red noise: let hierarchical priors handle it
# (no spin_injections_path = sample from priors)

# These ranges needed even if hierarchical priors are overridden
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0
efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = outputs/
output_id = cw_smoke_test
base_dir = {output_id}
