# Argus CW Intensive Run
# IPTA Mock Data Challenge 2, Dataset 3b (CW injection)

[Data]
data_path = ../../data/IPTA_MockDataChallenge2/dataset_3b/
excluded_psrs = J1640+2224
signal_model = cw

[NUTS]
# Intensive settings for better posteriors
num_samples = 2000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 10
dense_mass = false

[CWModel]
# All 7 CW parameters sampled

# Strain amplitude
log10_h0_fixed = false
log10_h0_min = -16.0
log10_h0_max = -12.0

# Source RA (radians)
alpha_gw_fixed = false
alpha_gw_min = 0.0
alpha_gw_max = 6.283185

# Source DEC via sin(delta)
sin_delta_gw_fixed = false
sin_delta_gw_min = -1.0
sin_delta_gw_max = 1.0
delta_gw_value = 0.0

# GW frequency
log10_f_gw_fixed = false
log10_f_gw_min = -9.0
log10_f_gw_max = -7.0

# Inclination
cos_iota_fixed = false
cos_iota_min = -1.0
cos_iota_max = 1.0

# Polarization angle
psi_fixed = false
psi_min = 0.0
psi_max = 3.14159

# Initial phase
Phi0_fixed = false
Phi0_min = 0.0
Phi0_max = 6.283185

[PriorModel]
# GW background (not used in CW mode)
log10_ha_fixed = true
log10_ha_value = -15.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

# Fix EFAC/EQUAD from noise file
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

# Pulsar red noise - hierarchical priors
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = outputs/
output_id = cw_intensive_run
base_dir = {output_id}
