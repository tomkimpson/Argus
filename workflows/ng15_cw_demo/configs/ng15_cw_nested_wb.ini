# NG15 CW injection-recovery demo (Earth-term only, fixed noise).
#
# Data: a subset of NANOGrav 15yr pulsars adapted from NanoGrav Discovery feathers
# by ../prepare_demo.py, with a known Earth-term CW injected (true params recorded
# in demo_data/injection.json). Noise is FIXED at Discovery's published values:
#   - white noise folded into per-TOA errors  -> noise_params.json (efac=1, equad~0)
#   - power-law red noise mapped to OU          -> spin_injections.pkl
# See ../../docs/discovery_review.md for caveats (ECORR dropped; OU~power-law approx).

[Data]
# Paths in this file resolve relative to THIS config's directory (configs/).
data_path = ../demo_data_wb/
# NOTE: must be non-empty. `excluded_psrs =` (empty) is parsed as [''] and ''
# matches every pulsar name, which would drop ALL pulsars from the fixed-noise
# arrays (utils.get_noise_parameters). Use a sentinel that matches no pulsar.
excluded_psrs = __none__
signal_model = cw
sampler = nested

[NUTS]
num_samples = 500
num_warmup = 500
num_chains = 2
target_accept_prob = 0.9
max_tree_depth = 7
dense_mass = false

[CWModel]
# Earth-term-only first demo: no pulsar term, so no per-pulsar chi nuisance params.
include_pulsar_term = false
phase_parameterization = true

log10_h0_fixed = false
log10_h0_min = -16.0
log10_h0_max = -12.0

alpha_gw_fixed = false
alpha_gw_min = 0.0
alpha_gw_max = 6.283185

sin_delta_gw_fixed = false
sin_delta_gw_min = -1.0
sin_delta_gw_max = 1.0
delta_gw_value = 0.0

log10_f_gw_fixed = false
log10_f_gw_min = -8.5
log10_f_gw_max = -7.3

cos_iota_fixed = false
cos_iota_min = -1.0
cos_iota_max = 1.0

psi_fixed = false
psi_min = 0.0
psi_max = 3.14159

Phi0_fixed = false
Phi0_min = 0.0
Phi0_max = 6.283185

[PriorModel]
# GWB common process fixed off (we are searching for a CW, not the background).
log10_ha_fixed = true
log10_ha_value = -20.0
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

# Fixed white noise (folded into per-TOA errors by the adapter).
noise_params_path = ../demo_data_wb/noise_params.json

# Fixed per-pulsar OU red noise (power-law -> OU mapping by the adapter).
spin_injections_path = ../demo_data_wb/spin_injections.pkl
log10_gamma_p_value = injected
log10_sigma_p_value = injected

# Prior bounds (unused when the above are fixed, but required by the parser).
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -22.0
log10_sigma_p_max = -12.0
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0
efac_min = 0.1
efac_max = 3.0
log10_equad_min = -9.0
log10_equad_max = -5.0

[NestedSampler]
num_live_points = 500
max_samples = 100000
s = 5
k = 0
num_posterior_samples = 2000

[Logging]
level = INFO
enable_file_logging = true

[Output]
output_dir = outputs/
output_id = ng15_cw_nested_wb
base_dir = {output_id}
