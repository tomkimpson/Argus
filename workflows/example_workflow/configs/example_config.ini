# Argus Dev Configuration

[Data]
# Path to the data directory
data_path = ../../data/IPTA_MockDataChallenge2/dataset_2b/
# Comma-separated list of pulsars to exclude from analysis (exclude more for faster dev testing)
excluded_psrs = J1640+2224

[NUTS]
# Minimal MCMC settings for rapid prototyping
num_samples = 200
num_warmup = 100
num_chains = 4
target_accept_prob = 0.855
max_tree_depth = 10
dense_mass = true

[PriorModel]


# 1. GW background parameters

## GW amplitude parameter 
log10_ha_fixed = false
log10_ha_value = -15.0
log10_ha_min = -18.0
log10_ha_max = -14.0

## Fix GW spectral index
log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.0
log10_gamma_a_max = -8.0


#2. Pulsar red noise parameters

## Path to the spin injections pickle file. 
## If provided, red noise parameters will be fixed to these values and the below min/max settings will be ignored
#spin_injections_path = ../data_files/approximate_spin_injections.pkl


# Pulsar red noise parameters - simplified ranges
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0

# Pulsar red noise amplitude parameter - narrower range
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# Hierarchical modeling is always enabled for improved MCMC sampling
# Hyperprior ranges for hierarchical modeling of gamma_p
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

# Hyperprior ranges for log-ratio parameterization

# Log-ratio parameterization is always enabled: log10(σp) = log10(γp) + log10(ratio)
# log10(σp) = log10(γp) + log10(ratio)
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC and EQUAD parameters

## Path to the noise parameters JSON file. 
## If provided, EFAC/EQUAD will be fixed to these values and the below min/max settings will be ignored
#noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

## EFAC parameters
efac_min = 0.1
efac_max = 3.0

## EQUAD parameters
log10_equad_min = -9.0
log10_equad_max = -5.0


[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to create internal log files (disable when using SLURM output redirection)
enable_file_logging = false

[Output]
# Base output directory (relative to workflow directory)
output_dir = outputs/
# Optional ID for output directory
output_id = results_dev_full
# Base directory for output files, {timestamp} or {output_id} will be replaced appropriately
base_dir = {output_id}