# Argus CLI Example Configuration
# This configuration demonstrates using the Argus CLI for Bayesian inference

[Data]
# Path to the data directory
data_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/data/IPTA_MockDataChallenge2/dataset_2b/
# Comma-separated list of pulsars to exclude from analysis
excluded_psrs = J1640+2224

[NUTS]
# Number of MCMC samples to draw (after warmup)
num_samples = 2000
# Number of warmup samples for adaptation
num_warmup = 1000
# Number of parallel chains
num_chains = 4
# Target acceptance probability for NUTS
target_accept_prob = 0.85
# Maximum tree depth
max_tree_depth = 10
# Initial step size (optional - let NUTS adapt if not specified)
# step_size = 0.01
# Enable dense mass matrix for better parameter correlation handling
dense_mass = true

[PriorModel]
# Parameter fixing via file paths
# Path to the noise parameters JSON file. If provided, EFAC/EQUAD will be fixed to these values
noise_params_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/data/IPTA_MockDataChallenge2/group1_psr_noise.json
# Path to the spin injections pickle file. If provided, red noise parameters will be fixed to these values
spin_injections_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/workflows/cli_example/data_files/approximate_spin_injections.pkl

# GW background parameters
# For each parameter, specify whether to use a fixed value or sample from a range
# If fixed=true, use the *_value parameter
# If fixed=false, use the *_min and *_max parameters
log10_ha_fixed = false
log10_ha_value = -15.0
log10_ha_min = -18.0
log10_ha_max = -14.0

# GW spectral index parameter
log10_gamma_a_fixed = false
log10_gamma_a_value = -9.0
log10_gamma_a_min = -10.0
log10_gamma_a_max = -8.0

# Pulsar red noise parameters
# If spin_injections_path is provided, red noise parameters will be fixed to those values
# If not provided, these ranges will be used for sampling
log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0

# Pulsar red noise amplitude parameter ranges (used when not fixed via spin_injections_path)
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# Hierarchical modeling for gamma_p
hierarchical_noise = true
# Hyperprior ranges for hierarchical modeling of gamma_p
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

# Sigma_p uses log-ratio parameterization: log10(σp) = log10(γp) + log10(ratio)

# Log-ratio parameterization for sigma_p
log_ratio_parameterization = true
# log10(σp) = log10(γp) + log10(ratio)
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# EFAC and EQUAD parameters
# If noise_params_path is provided, EFAC/EQUAD will be fixed to those values
# If not provided, these ranges will be used for sampling
# EFAC uniform prior
efac_min = 0.1
efac_max = 3.0
# EQUAD log10 prior: log10(EQUAD) ~ U(-9, -5)
log10_equad_min = -9.0
log10_equad_max = -5.0

[ModelSelection]
# Whether to run model comparison (with and without GW background)
run_comparison = true
# Models to compare: 'gw' (with GW background), 'no_gw' (noise only)
models = gw,no_gw

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to save detailed timing information
save_timing = true

[Output]
# Base output directory (relative to workflow directory)
output_dir = outputs/
# Optional ID for output directory. If not provided or empty, timestamp will be used.
output_id = 
# Base directory for output files, {timestamp} or {output_id} will be replaced appropriately
base_dir = {timestamp}
# Output file prefix (timestamp will be added automatically)
output_prefix = cli_analysis
# Whether to save intermediate results
save_intermediate = true
# Whether to generate corner plots
generate_plots = true