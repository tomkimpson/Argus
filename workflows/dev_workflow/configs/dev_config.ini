# Argus Dev Configuration
# This configuration is optimized for fast development testing with simplified parameters

[Data]
# Path to the data directory
data_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/data/IPTA_MockDataChallenge2/dataset_2b/
# Comma-separated list of pulsars to exclude from analysis (exclude more for faster dev testing)
excluded_psrs = J1640+2224


[NUTS]
# Minimal MCMC settings for rapid prototyping
num_samples = 200
num_warmup = 100
num_chains = 2
target_accept_prob = 0.80
max_tree_depth = 8
# Use simpler mass matrix
dense_mass = false

[PriorModel]
# Parameter fixing via file paths
# Path to the noise parameters JSON file. If provided, EFAC/EQUAD will be fixed to these values
noise_params_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/data/IPTA_MockDataChallenge2/group1_psr_noise.json
# Path to the spin injections pickle file. If provided, red noise parameters will be fixed to these values
spin_injections_path = /fred/oz022/tkimpson/tmp/argus_dev/Argus/workflows/cli_example/data_files/approximate_spin_injections.pkl

# GW background parameters - simplified for dev testing
# Fix GW amplitude to speed up inference
log10_ha_fixed = true
log10_ha_value = -15.0

# Fix GW spectral index to reduce parameter space
log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5

# Pulsar red noise parameters - simplified ranges
log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0

# Pulsar red noise amplitude parameter - narrower range
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

# Enable hierarchical modeling for testing
hierarchical_noise = true
# Hyperprior ranges for hierarchical modeling of gamma_p
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

# Sigma_p uses log-ratio parameterization: log10(σp) = log10(γp) + log10(ratio)

# Enable log-ratio parameterization for testing
log_ratio_parameterization = true
# log10(σp) = log10(γp) + log10(ratio)
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# EFAC and EQUAD parameters - narrower ranges
efac_min = 0.5
efac_max = 2.0
# EQUAD log10 prior: narrower range
log10_equad_min = -8.0
log10_equad_max = -6.0

[ModelSelection]
# Whether to run model comparison (with and without GW background)
run_comparison = false
# Models to compare: 'gw' (with GW background), 'no_gw' (noise only)
models = gw

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to save detailed timing information
save_timing = true

[Output]
# Base output directory (relative to workflow directory)
output_dir = outputs/
# Optional ID for output directory
output_id = dev_run
# Base directory for output files, {timestamp} or {output_id} will be replaced appropriately
base_dir = {output_id}
# Output file prefix (timestamp will be added automatically)
output_prefix = dev_analysis
# Whether to save intermediate results
save_intermediate = true
# Whether to generate corner plots
generate_plots = true