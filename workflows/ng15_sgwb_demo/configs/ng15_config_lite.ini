# NG15 SGWB lite injection-recovery config (workflow task T2.2).
#
# Purpose: the single lite NUTS config consumed by the Stage-2 GPU de-risking runs on
# the *real* NG15 sampling geometry with a *synthetic* injected signal:
#   T2.3 (control)      -> data/inject_ou/       OU-injected, expect log10_ha ~ -14.35
#   T2.4 (decision gate)-> data/inject_powerlaw/ power-law-injected (log10_A_gw=-14.6, gamma=13/3)
# One config serves both: flip `data_path` (and `output_id`, in the SLURM script) between runs.
#
# Cloned from ../mdc2_smoke_lite.ini's patterns: ABSOLUTE input/output paths (relative
# ../../data paths do not resolve from the standard invocation cwd in this checkout) and
# the corrected-q11 (gamma**2) ha-scaling. Unlike the MDC2 smoke config, the log10_ha prior
# is centred on the *known* OU injection truth (-14.35), not MDC2's real signal (~-12.9).
#
# White noise is FIXED (matches the injected values in ng15_psr_noise.json); pulsar red
# noise is FREE/hierarchical (no red noise was injected -> should recover small). Only
# log10_ha / log10_gamma_a carry the GW signal.

[Data]
# DEFAULT = OU control (T2.3). For T2.4, switch to .../data/inject_powerlaw/
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/inject_ou/
# Keep all 6 subset pulsars (B1855+09, J0613-0200, J1600-3053, J1713+0747, J1744-1134, J1909-3744).
# Must be a NON-MATCHING sentinel, not blank: utils.get_noise_parameters passes excluded_psrs
# raw (no blank filtering, unlike workflow.py), so an empty value -> ['']  and  '' in psr  matches
# every pulsar -> all excluded -> empty noise arrays. __NONE__ is a substring of no feather name.
excluded_psrs = __NONE__

[NUTS]
# Minimal MCMC settings for rapid Stage-2 iteration
num_samples = 200
num_warmup = 100
num_chains = 2
target_accept_prob = 0.80
max_tree_depth = 8
dense_mass = false

[PriorModel]

# 1. GW background parameters
# Priors bracket the OU injection truth (log10_ha=-14.35, log10_gamma_a=-8.5) with interior
# room above for the power-law->OU amplitude mapping probed in T2.4 (unknown, plausibly higher).
log10_ha_fixed = false
log10_ha_value = -14.35
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
log10_gamma_a_max = -7.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via NG15 per-pulsar noise JSON -- matches the injected values)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_inject_lite
base_dir = {output_id}
