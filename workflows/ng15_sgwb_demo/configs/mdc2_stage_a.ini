# M1 Stage A: MDC2 single-pulsar noise-characterization run (issue #111).
#
# TEMPLATE — do not run directly. slurm_scripts/mdc2_stage_a.sh sed-replaces the
# __PSR_DATA_DIR__ / __PSR_NOISE_JSON__ / __PSR__ placeholders with absolute
# paths for one pulsar (staged by scripts/stage_mdc2.py) and writes the derived
# config to outputs/derived_configs/.
#
# Design (see the M1 plan):
# - GW FIXED at a negligible amplitude (log10_ha = -20): a single pulsar cannot
#   separate GW auto-power from intrinsic red noise, so the OU process absorbs
#   the TOTAL per-pulsar red power — exactly the quantity Stages B/C consume.
# - red_noise_prior = flat: independent Uniform priors on (log10_γp, log10_σp).
#   The shared population hyperpriors are degenerate at n=1; flat mode samples a
#   clean 2-D posterior per pulsar.
# - EFAC/EQUAD FIXED from the MDC2 truth (per-pulsar slice of
#   group1_psr_noise.json, written next to the feather by stage_mdc2.py).
# - Prior ranges are deliberately wide; scripts/extract_stage_a.py flags any
#   pulsar whose posterior rails against these edges.

[Data]
data_path = __PSR_DATA_DIR__
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 10
# 2-D problem: a dense mass matrix is free and learns the γp<->σp correlation.
dense_mass = true

[PriorModel]

# 1. GW background parameters — FIXED negligible (see header)
log10_ha_fixed = true
log10_ha_value = -20.0
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# 2. Pulsar red noise — SAMPLED with flat per-pulsar priors
spin_injections_path =
red_noise_prior = flat

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# 3. EFAC/EQUAD — FIXED from the per-pulsar MDC2 truth slice
noise_params_path = __PSR_NOISE_JSON__

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_stageA___PSR__
base_dir = {output_id}
