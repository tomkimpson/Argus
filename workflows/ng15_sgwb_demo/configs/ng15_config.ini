# NG15 SGWB Stage-3 PRODUCTION config (workflow task T3.1) -- REAL aligned NG15 data.
#
# This is the headline production run: the mature GWB + Hellings-Downs + NUTS path on the
# REAL epoch-aligned NG15 wideband feathers (data/aligned/, 6 pulsars x 78 joint epochs),
# after the Stage-2 decision gate passed (T2.4: a true power-law GWB is recovered by Argus's
# OU model to within ~0.5 sigma in BAND-REFERENCED AMPLITUDE, stable lite->hi-res).
#
# What is being measured: the common HD-correlated SGWB *band-referenced amplitude* -- THE
# robust observable. The OU spectral shape/index (the log10_gamma_a corner) is NOT recovered
# for a power-law-shaped signal and is not the reported quantity (PLAN framing; T2.4).
#
# log10_gamma_a is DELIBERATELY FREE (not fixed). The Stage-2 `fixg` sweep tested fixing it and
# found its "band amplitude invariant to fixed gamma_a" claim to be FALSE: the free run recovers
# gamma_a ~ -7.3 (near the band bottom) with band-amplitude bias -0.20 dex / -0.46 sigma, but
# FIXING gamma_a below that starves the OU corner of in-band power and biases the observable LOW
# by 1.3-1.9 dex (fixg m80 @ -8.0 -> -1.30 dex/-1.57 sigma; m85 @ -8.5 -> -1.94 dex/-3.01 sigma;
# outputs/ng15_fixg_m8{0,5}_powerlaw/comparison.json). Fixing gamma_a is therefore NOT a valid
# cross-check here -- it biases the amplitude -- so the production run keeps it free.
#
# Expect a PATHOLOGICAL GWB corner (T2.4 confirm: r_hat 1.05, ESS 51, 50 divergences even at
# hi-res, from the curved h_a<->gamma_a ridge). Mitigations baked in below: target_accept=0.95,
# dense_mass=true, generous warmup. num_chains=4 pairs with --gres=gpu:4 (T3.2) to run the chains
# in parallel across GPUs.
#
# Cloned from ng15_config_confirm.ini (absolute paths, __NONE__ sentinel, corrected-q11 framing).
# Differences vs the confirm config: data_path -> real aligned feathers; NUTS 2000/1000/4 with
# target_accept 0.90 -> 0.95; log10_ha prior widened/recentred for the published amplitude;
# output_id -> ng15_real. Everything else (FIXED white noise, FREE/hierarchical red noise) is kept.

[Data]
# REAL epoch-aligned NG15 wideband feathers (regenerate via T1.2-T1.5 scripts; gitignored).
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/aligned/
excluded_psrs = __NONE__

[NUTS]
# Production-grade NUTS. num_chains=4 -> run in parallel across 4 x A100 (T3.2 --gres=gpu:4).
num_samples = 2000
num_warmup = 1000
num_chains = 4
# Raised 0.90 -> 0.95 to suppress the GWB-corner divergences expected on real data (T2.4 caveat).
target_accept_prob = 0.95
max_tree_depth = 10
dense_mass = true

[PriorModel]

# 1. GW background parameters
log10_ha_fixed = false
# Init near the published-amplitude expectation: NG15 A_gw ~ -14.6 maps to OU log10_ha ~ -13.5
# under the T2.4 power-law->OU band-amplitude calibration.
log10_ha_value = -13.5
# Wide/uninformative; brackets the published-mapped ~-13.5 with headroom on both sides.
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
# Upper edge widened (was -7.0) so the OU corner is not truncated by the prior.
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via NG15 per-pulsar noise JSON)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_real
base_dir = {output_id}
