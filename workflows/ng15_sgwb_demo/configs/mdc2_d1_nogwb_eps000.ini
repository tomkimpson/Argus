# NO-INJECTION CONTROL (openspec sgwb-detection-route task 1.9): one rung of the flat-prior
# ladder on a SYNTHESISED SIGNAL-FREE dataset at the MDC2 1b geometry.
#
# The model-selection spec asks for three things from the evidence estimator. Two now pass on
# real 1b data: the injected-signal case (lnB = +3.043 +/- 0.015) and falsification by sky
# scramble (lnB = -0.766 +/- 0.010). This ladder is the third and last:
#
#   Scenario: Null case -- no injected correlated signal
#     WHEN the estimator is run on a matched dataset with no injected correlated signal
#     THEN it returns lnB(HD/CURN) consistent with zero
#
# The sky scramble does NOT close this. A scramble mis-describes a correlation that is
# genuinely present, so it must land BELOW zero -- and it did. "Consistent with zero" is a
# statement about data with no correlation to describe at all, which is a different test and
# needs a different dataset.
#
# MDC2 group1 contains no such dataset: group1_gw_parameters.json holds dataset1 and dataset2
# as GWBs and dataset3 as a continuous-wave source. So the control is synthesised, by
# scripts/inject_powerlaw_gwb.py, which replaces the residual column outright while keeping
# every other feather field (TOAs, errors, design matrix, sky positions, F0, distance) from
# real 1b:
#
#   JAX_PLATFORMS=cpu python scripts/inject_powerlaw_gwb.py --mode powerlaw \
#       --aligned-dir data/mdc2_d1_all \
#       --noise-json ../data/IPTA_MockDataChallenge2/group1_psr_noise.json \
#       --out-dir data/mdc2_d1_nogwb --log10-A-gw -30 --gamma 4.333333333333333 --seed 0
#
# log10_A_gw = -30 puts the correlated component at a pivot PSD of 2.8e-37 s^3 against 1b's
# injected 1.2e-7 -- numerically nil, but reached through the SAME code path that produced the
# tracked kernel-systematic injections, and recorded in injection_truth.json so the control
# documents itself. White noise is on (efac/equad from group1_psr_noise.json); per-pulsar red
# noise is off, which matches g1.d1b exactly: the IPTA MDC2 dataset table lists g1.d1a(b) as
# WN only and g1.d2a(b) as WN+RN. Measured residual RMS is 0.87-1.09x the white-noise
# prediction across the 33 pulsars, i.e. white noise and nothing else.
#
# Everything below is configs/mdc2_d1_flat_rung.ini.template with exactly two values changed
# (data_path, output_id), so this ladder is comparable to the +3.043 one line for line.
#
# PRE-REGISTERED CRITERION, recorded before the number was read. The estimator's +/-0.01 is its
# own numerical precision, not the scale on which "consistent with zero" is judged: a
# no-injection control has a true lnB that is mildly negative from Occam, not exactly 0.
#   PASS   reliable: true and |lnB| < 1  -- no evidence either way, decisively short of the
#          lnB >= 3 gate.
#   FAIL   lnB near +3 -- the estimator manufactures HD evidence on noise. Stops the route.
#   OTHER  lnB near -0.77 would say the estimator penalises ANY correlation model on
#          noise-only data. Not a failure, but a different finding, and reportable.
#
# The rung value is substituted by the SLURM script; this file is the template and is not
# run directly.

[Data]
data_path = ../data/mdc2_d1_nogwb
excluded_psrs = __NONE__

[NUTS]
num_samples = 1000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 8
dense_mass = false
dense_mass_blocks = log10_pivot_psd_prime, log10_gamma_a_prime

[PriorModel]

# 1. GW background parameters — SAMPLED
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# Ridge GW parameterization (issue #109): sample the band-referenced pivot
# log-PSD + log10_gamma_a as independent coordinates, deriving log10_ha, to
# straighten the curved ha<->gamma_a ridge that stalled the direct-basis runs
# (one chain per run got stuck at high amplitude, r_hat 1.5-2.3). The pivot
# log-PSD range [-13,-5] brackets both the injected (~-6.9 on 1b) and the
# empirical-prior recovered (~-9.5) values with room; pivot f = 1/(5 yr).
gw_parameterization = ridge
log10_pivot_psd_min = -13.0
log10_pivot_psd_max = -5.0
gw_pivot_freq_hz = 6.3376e-09

# Correlation path held at one rung of the ladder.
orf_path = fixed
orf_epsilon_value = 0.0

# 2. Pulsar red noise — SAMPLED under independent flat Uniform priors.
#
# THIS IS THE ONE CHANGE UNDER TEST. The empirical block was:
#     empirical_priors_path = ../data/stage_a_d1_empirical_priors.json
#     empirical_prior_inflation = 2.0
# and is deliberately absent: empirical_priors_path takes PRECEDENCE over
# red_noise_prior in get_pulsar_noise_priors, so setting flat is not enough --
# the path must be gone. Ranges are the same as the empirical runs, which is
# what makes this a removal rather than a reparameterization.
spin_injections_path =
red_noise_prior = flat

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# 3. EFAC/EQUAD — FIXED from MDC2 truth
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Checkpointing]
enabled = true
interval = 250
resume = false

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_d1_nogwb_eps000
base_dir = {output_id}
