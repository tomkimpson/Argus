# NG15 SGWB Stage-3 CURN config (workflow task T3.4) -- REAL aligned NG15 data.
#
# This is a byte-for-byte clone of ng15_config.ini (the T3.1 HD production config)
# differing ONLY in output_id (ng15_real -> ng15_curn). The CURN physics is NOT in
# this file: it is applied at runtime by run_curn.py, which overrides the data
# loader's Hellings-Downs correlation matrix with the identity (common UNCORRELATED
# red noise) before the Kalman filter is built -- no library edit.
#
# Keeping priors / NUTS settings / noise handling identical to the HD run is
# deliberate: the HD-vs-CURN Bayes factor lnB = logZ_HD - logZ_CURN is only
# meaningful if the two models differ ONLY in the inter-pulsar correlation structure.
#
# Run:  python run_curn.py configs/ng15_curn_config.ini   (via slurm_scripts/ng15_curn_run.sh)

[Data]
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/aligned/
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.95
max_tree_depth = 10
dense_mass = true

[PriorModel]

# 1. GW background parameters
log10_ha_fixed = false
log10_ha_value = -13.5
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via NG15 per-pulsar noise JSON)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_curn
base_dir = {output_id}
