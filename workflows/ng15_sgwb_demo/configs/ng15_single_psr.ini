# OU-adequacy step 3: single-pulsar Argus OU red-noise fit on REAL NG15 wideband data.
#
# TEMPLATE -- do not run directly. slurm_scripts/ng15_single_psr.sh sed-replaces the
# data_path / noise_params_path / output_id lines with absolute paths for one pulsar
# (staged by slurm_scripts/ng15_single_prep.sh) and writes the derived config to
# outputs/derived_configs/.
#
# Same design as M1 Stage A (configs/mdc2_stage_a.ini) except for the data and wider priors:
# - GW FIXED negligible (log10_ha = -20), so the per-pulsar OU absorbs all red power.
# - red_noise_prior = flat on (log10_gamma_p, log10_sigma_p), boxes widened to
#   [-12,-4] x [-20,-9] (Stage A: [-12,-6] x [-20,-12]). CAVEAT: the OU-adequacy results
#   (PR #119) were run before fix/flat-red-noise-prior, when "flat" on the NUTS path was
#   an unbounded Gaussian N(mid, (hi-lo)/(6 sqrt N)); here N = 1, giving
#   N(-8, 1.33) x N(-14.5, 1.83). It is now a true bounded Uniform.
# - EFAC/EQUAD FIXED at the collapsed NG15 values (data/ng15_psr_noise_full.json).
# - Data: the pulsar's own 30-day inverse-variance-binned epochs with DMX_* dropped,
#   i.e. the treatment the full-array (M3) run would use.
# The comparison against the published NG15 power-law band is
# scripts/compare_single_psr_ou.py.

[Data]
data_path = __PSR_DATA_DIR__
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1000
# 2 chains, not 4: chains run SEQUENTIALLY on the single GPU (~25 min each at
# ~2 it/s on MDC2, measured in job 14572769).
# Two chains still give r_hat, and 4000 draws is ample for a 2-D posterior.
num_chains = 2
target_accept_prob = 0.9
max_tree_depth = 10
# 2-D problem: a dense mass matrix is free and learns the γp<->σp correlation.
dense_mass = true

[PriorModel]

# 1. GW background parameters — FIXED negligible (see header)
log10_ha_fixed = true
log10_ha_value = -20.0
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# 2. Pulsar red noise — SAMPLED with flat per-pulsar priors
spin_injections_path =
red_noise_prior = flat

# Wider than Stage A's [-12,-6] x [-20,-12]: step 2 found five shallow (gamma_PL ~ 0.2-1.1)
# pulsars whose best OU wants the corner ABOVE the band (OU at its f^-2 limit) and sigma_p
# up to ~-12.2. At the f^-2 limit only sigma_p/gamma_p is identified. (The effective prior is
# Gaussian, see header, so the box edges are not hard walls and "railing" cannot occur.)
log10_gamma_p_min = -12.0
log10_gamma_p_max = -4.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -9.0

# 3. EFAC/EQUAD — FIXED from the collapsed NG15 values
noise_params_path = __PSR_NOISE_JSON__

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = ng15_single___PSR__
base_dir = {output_id}
