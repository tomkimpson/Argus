# NG15 SGWB Stage-3 FULL-ARRAY CONVERGENCE CHECK (workflow task T3.5) -- REAL union-aligned data.
#
# Same full ~68-pulsar union-aligned array as ng15_config_full_quicklook.ini, but with a per-block
# DENSE mass matrix over the two GW latents to straighten the log10_ha<->log10_gamma_a ridge that
# broke the diagonal-mass quick-look (job 14195666: max r_hat ~18.6, min ESS 4, one outlier chain
# at log10_ha ~ -12.65 vs -13.41). scripts/diagnose_gw_ridge.py confirmed a clean, strongly LINEAR
# ridge (corr(log10_ha, log10_gamma_a) = +0.75) and that every high-r_hat log10_sigma_p follows
# that SAME outlier chain -> a 2x2 dense block on (log10_ha_prime, log10_gamma_a_prime) is the
# targeted, posterior-EXACT fix (a mass matrix only preconditions NUTS; it never changes the
# target density or any site name).
#
# This is a CHEAP convergence check (4 chains, 500 warmup + 500 samples) -- NOT the production run.
# Success criterion: r_hat(log10_ha) -> ~1 and the outlier chain disappears. If it passes, launch
# the full-settings ng15_config_full.ini (1000+2000). Distinct output_id so the existing quick-look
# outputs are preserved for the before/after comparison.

[Data]
# REAL union-aligned NG15 wideband feathers, full array (build_aligned_feathers.py --grid union;
# gitignored). Carries a per-epoch mask consumed by the joint filter.
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/aligned_full/
excluded_psrs = __NONE__

[NUTS]
# Production-grade NUTS. num_chains=4 -> run in parallel across 4 x A100 (--gres=gpu:4).
num_samples = 500
# 300 -> 500: the diagonal blocks (per-pulsar red noise) still need warmup to adapt at ~142-D; the
# GW block is handled by dense_mass_blocks below. 500 keeps wall time ~half-day while giving the
# mass matrix room to adapt.
num_warmup = 500
num_chains = 4
target_accept_prob = 0.95
# Depth 7: bounds each iteration to <=127 leapfrog steps so every chain finishes in walltime (see
# ng15_config_full_quicklook.ini header for the depth-10 stall history).
max_tree_depth = 7
# Diagonal mass matrix everywhere EXCEPT the GW corner, which gets a dense 2x2 block to learn the
# +0.75 ridge correlation. Overrides the boolean dense_mass below. Sites are NumPyro latent-site
# names (the reparameterized *_prime draws); ';' would separate independent groups.
dense_mass = false
dense_mass_blocks = log10_ha_prime, log10_gamma_a_prime

[PriorModel]

# 1. GW background parameters
log10_ha_fixed = false
log10_ha_value = -13.5
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via the full-array NG15 per-pulsar noise JSON)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise_full.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_full_qlblock
base_dir = {output_id}
