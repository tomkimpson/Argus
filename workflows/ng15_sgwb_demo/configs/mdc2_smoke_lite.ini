# MDC2 GWB smoke-test config (workflow task T0.1).
#
# Purpose: after the get_Q_block q11 bugfix (γ**3 -> γ**2, ~7655-nat likelihood
# shift), confirm the GWB+HD+NUTS recovery path is still healthy on the known-good
# idealized MDC2 dataset_2b (33 pulsars, 185 synchronous TOAs) before building the
# Stage-2 OU-vs-power-law gate on it. This is a clone of
# ../../example_workflow_lite/configs/example_config_lite.ini with ABSOLUTE input
# paths (the committed lite config's ../../data paths do not resolve from the
# standard invocation cwd in this checkout).
#
# Red noise + white noise are FIXED (spin_injections_path / noise_params_path), so
# only the GW params (log10_ha, log10_gamma_a) + their hierarchical hyperpriors are
# sampled -- a clean GW-recovery health check.

[Data]
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/data/IPTA_MockDataChallenge2/dataset_2b/
excluded_psrs = J1640+2224

[NUTS]
num_samples = 200
num_warmup = 100
num_chains = 2
target_accept_prob = 0.80
max_tree_depth = 8
dense_mass = false

[PriorModel]

# 1. GW background parameters
# Priors WIDENED + re-centred for the corrected q11 (γ**2) ha-scaling: the fix makes
# the r-state noise ∝ ha²·γa (was ∝ ha²), so the same GWB maps to a higher log10_ha.
# The narrow [-18,-14] range railed (recovered -12.9 at the +4.67σ prior edge); these
# ranges bracket that with interior room.
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FIXED via injections pickle)
spin_injections_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/example_workflow_lite/data_files/approximate_spin_injections.pkl

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via noise JSON)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = mdc2_smoke_wide
base_dir = {output_id}
