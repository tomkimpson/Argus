# M1 Stage B (CURN): null-model twin of mdc2_stage_b_hd.ini (issue #111).
#
# Identical to mdc2_stage_b_hd.ini except output_id — run with run_curn.py,
# which swaps the Hellings-Downs ORF for the identity matrix (common
# uncorrelated red noise) at load time. Keeping every prior/NUTS setting
# byte-identical is what makes the HD-vs-CURN evidence comparison (Stage D,
# logz_lhm.py matched-shrinkage lnB) valid term-for-term.
# See mdc2_stage_b_hd.ini for the design notes.

[Data]
data_path = ../data/mdc2_all
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1500
num_chains = 4
target_accept_prob = 0.9
# Depth capped at 5 (down from 7/8 after three stalls: 14593114, 14635408,
# 14635407). Both CURN *and* HD had exactly ONE straggler chain that consumed
# the WHOLE depth budget every iteration while the other three finished 3500
# iters in ~45 min. So lowering the cap barely helped (17 -> 19 s/it, 8 -> 7):
# the straggler always maxes whatever cap it is given. The culprit is the
# curved log10_ha<->log10_gamma_a ridge (the issue #109 geometry, now isolated
# at 2-D) -- a dense mass matrix captures only LINEAR correlation, not the
# curve, so the unlucky chain's trajectories never U-turn.
# Key measurement: the healthy chains run at ~1.3 it/s ~ 5 leapfrog steps, i.e.
# tree depth ~3. NO healthy chain needs depth > 3, so capping at 5 costs them
# nothing and hard-bounds a straggler to ~5h/3500-iter (robust to the observed
# ~2x per-step timing variance). r_hat across 4 chains adjudicates mixing; the
# 3 healthy chains pool fine regardless. Proper fix for M3 is a GW-corner
# reparameterization to straighten the ridge (issue #109 follow-up).
max_tree_depth = 5
dense_mass = true

[PriorModel]

# 1. GW background parameters — SAMPLED
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# 2. Pulsar red noise — FIXED at Stage A single-pulsar medians
spin_injections_path = ../data/stage_a_medians.pkl

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

log10_gamma_p_mean_min = -10.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD — FIXED from MDC2 truth
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_stageB_curn
base_dir = {output_id}
