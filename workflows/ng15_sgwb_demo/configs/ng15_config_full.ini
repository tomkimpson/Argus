# NG15 SGWB Stage-3 FULL-ARRAY config (workflow task T3.5) -- REAL union-aligned NG15 data.
#
# Scales the T3.3 subset run to the full ~68-pulsar NG15 wideband array. The joint GWB Kalman
# filter now supports MISSING OBSERVATIONS (per-epoch mask), so pulsars keep their true,
# heterogeneous baselines instead of being truncated to the window where all overlap. The
# feathers are built with `build_aligned_feathers.py --grid union` (union epoch grid + mask
# column); the filter skips absent (epoch, pulsar) cells in its measurement update.
#
# Dimensionality: 2 GW + 2 x Npsr red-noise + 4 hierarchical hyperpriors. At Npsr=68 that is
# ~142 sampled dimensions (vs 18 on the 6-pulsar subset).
#
# dense_mass is DELIBERATELY FALSE here. A dense (~142 x 142) mass matrix needs far more warmup
# to adapt and is memory-heavy; a diagonal mass matrix is the standard choice at this
# dimensionality. (The subset used dense_mass=true at 18-D, which is cheap; it does not scale.)
# Revisit only if the diagonal-mass run mixes poorly on the GW corner.
#
# Everything else follows the subset production config (ng15_config.ini): FIXED per-pulsar white
# noise, FREE/hierarchical red noise, log10_gamma_a FREE (fixing it biases the band amplitude --
# see ng15_config.ini header), target_accept=0.95 to suppress the h_a<->gamma_a-ridge divergences,
# num_chains=4 paired with --gres=gpu:4. Band-referenced amplitude is THE observable, not the corner.

[Data]
# REAL union-aligned NG15 wideband feathers, full array (build_aligned_feathers.py --grid union;
# gitignored). Carries a per-epoch mask consumed by the joint filter.
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/aligned_full/
excluded_psrs = __NONE__

[NUTS]
# Production-grade NUTS. num_chains=4 -> run in parallel across 4 x A100 (--gres=gpu:4).
num_samples = 2000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.95
max_tree_depth = 7
# Diagonal mass matrix at ~142-D (see header). dense_mass does not scale from the 18-D subset.
dense_mass = false

[PriorModel]

# 1. GW background parameters
log10_ha_fixed = false
# Init near the published-amplitude expectation (NG15 A_gw ~ -14.6 -> OU log10_ha ~ -13.5 via the
# T2.4 band-amplitude calibration); the subset recovered -13.40 +/- 0.20.
log10_ha_value = -13.5
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via the full-array NG15 per-pulsar noise JSON)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise_full.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_full
base_dir = {output_id}
