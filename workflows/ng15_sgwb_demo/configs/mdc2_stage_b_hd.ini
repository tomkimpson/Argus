# M1 Stage B (HD): MDC2 33-pulsar array run with red noise FIXED at the Stage A
# single-pulsar medians (issue #111).
#
# Only the 2 GW parameters (log10_ha, log10_gamma_a) are sampled; per-pulsar red
# noise comes from data/stage_a_medians.pkl (written by
# scripts/extract_stage_a.py after the Stage A array job) and EFAC/EQUAD from the
# MDC2 truth JSON. Run with run_analysis.py (Hellings-Downs ORF). The CURN twin
# (mdc2_stage_b_curn.ini + run_curn.py) differs only in output_id.
#
# Truth: injected GWB log10_A = -14.886 (group1_gw_parameters.json, dataset2).
# GW prior ranges follow mdc2_smoke_lite.ini (widened + re-centred for the
# corrected q11 ha-scaling; the narrow [-18,-14] range railed).
#
# Relative paths resolve against this file's directory (utils.resolve_config_paths).
# If Stage A drops any pulsar, set excluded_psrs accordingly (extract_stage_a.py
# --drop-failing prints the string) — it must match the pickle contents.

[Data]
data_path = ../data/mdc2_all
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1500
num_chains = 4
target_accept_prob = 0.9
# Depth capped at 7 and warmup raised to 1500 after TWO CURN runs (14593114,
# 14635408) each had exactly ONE straggler chain maxing the tree every
# iteration (~17 s/it) while the other three finished 3000 iters in ~45 min.
# With HD cross-correlations removed, the CURN GW amplitude is weakly
# identified -> a broad/flat direction in (log10_ha, log10_gamma_a) that ~1/4
# of inits fall into and whose trajectories never U-turn. Depth 7 (127 steps)
# hard-bounds a straggler to ~8h/3500-iter; longer warmup reduces how often a
# chain mis-adapts. r_hat across the 4 chains adjudicates whether any chain
# failed to mix (the 3 healthy chains pool fine regardless).
max_tree_depth = 7
# 2-D problem: dense mass is free and learns the ha<->gamma_a ridge.
dense_mass = true

[PriorModel]

# 1. GW background parameters — SAMPLED
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# 2. Pulsar red noise — FIXED at Stage A single-pulsar medians
spin_injections_path = ../data/stage_a_medians.pkl

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

log10_gamma_p_mean_min = -10.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD — FIXED from MDC2 truth
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_stageB_hd
base_dir = {output_id}
