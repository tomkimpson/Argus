# M1 Stage C (HD): MDC2 33-pulsar array run with EMPIRICAL per-pulsar red noise
# priors from the Stage A single-pulsar posteriors (issue #111).
#
# Per-pulsar red noise is SAMPLED, but constrained by Normal priors on
# (log10_γp, log10_ratio) whose (loc, scale) come from
# data/stage_a_empirical_priors.json (written by scripts/extract_stage_a.py).
# This is the factorized-likelihood-style route: 2 GW + 2x33 noise = 68 sampled
# dims, no population hyperpriors. Compare against Stage B (noise fixed) for
# truth recovery; the winner becomes the M3 real-data procedure.
#
# NUTS settings follow the #109 lessons for high-D GWB runs:
# - dense_mass_blocks learns the log10_ha<->log10_gamma_a ridge (the leading
#   suspect at 142-D) with a 2x2 dense block; everything else stays diagonal.
# - max_tree_depth capped at 8 (a depth-10 chain at 142-D built ~1000-step
#   trajectories and stalled; 68-D is easier but start capped).
# - Escalation ladder if mixing is poor: target_accept_prob 0.95 ->
#   max_tree_depth 10 -> empirical_prior_inflation 3.0.
#
# empirical_prior_inflation = 2.0: single-pulsar posteriors are overconfident
# (each pulsar's fit absorbs GW power into its own red noise); inflating the
# prior widths gives the array run room to reattribute that power.
#
# If Stage A drops any pulsar, set excluded_psrs accordingly (must yield the
# same pulsar set as the JSON after its own exclusion filtering).

[Data]
data_path = ../data/mdc2_all
excluded_psrs = __NONE__

[NUTS]
num_samples = 2000
num_warmup = 1500
num_chains = 4
target_accept_prob = 0.9
max_tree_depth = 8
dense_mass = false
dense_mass_blocks = log10_pivot_psd_prime, log10_gamma_a_prime

[PriorModel]

# 1. GW background parameters — SAMPLED
log10_ha_fixed = false
log10_ha_value = -12.5
log10_ha_min = -16.0
log10_ha_max = -9.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -11.0
log10_gamma_a_max = -6.0

# Ridge GW parameterization (issue #109): sample the band-referenced pivot
# log-PSD + log10_gamma_a as independent coordinates, deriving log10_ha, to
# straighten the curved ha<->gamma_a ridge that stalled the direct-basis runs
# (one chain per run got stuck at high amplitude, r_hat 1.5-2.3). The pivot
# log-PSD range [-13,-5] brackets both the injected (~-6.3) and the direct-run
# recovered (~-9.2) values with room; pivot f = 1/(5 yr).
gw_parameterization = ridge
log10_pivot_psd_min = -13.0
log10_pivot_psd_max = -5.0
gw_pivot_freq_hz = 6.3376e-09

# 2. Pulsar red noise — SAMPLED with empirical per-pulsar priors
spin_injections_path =
empirical_priors_path = ../data/stage_a_empirical_priors.json
empirical_prior_inflation = 2.0

log10_gamma_p_min = -12.0
log10_gamma_p_max = -6.0
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# 3. EFAC/EQUAD — FIXED from MDC2 truth
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_id = mdc2_stageC_hd_ridge
base_dir = {output_id}
