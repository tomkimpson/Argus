# NG15 SGWB Stage-2 CONFIRMATION config (workflow task T2.4 hi-res re-run).
#
# The lite config (ng15_config_lite.ini, 200/100/2) cleared the OU->OU control but was
# UNDER-CONVERGED on the harder power-law->OU gate (max r_hat 1.05, min ESS 34). This config
# repeats both Stage-2 runs at production-grade NUTS resolution so the load-bearing decision-gate
# result is defensible before greenlighting Stage 3:
#   MODE=ou        -> data/inject_ou/       (control, re-run for an apples-to-apples baseline)
#   MODE=powerlaw  -> data/inject_powerlaw/ (the decision gate)
# Driven by slurm_scripts/ng15_confirm_run.sh (4 x A100, chains run in parallel).
#
# Differences vs ng15_config_lite.ini:
#   * NUTS: 1000 warmup / 1000 samples / 4 chains, target_accept 0.90, max_tree_depth 10,
#     dense_mass=true (learns the ha<->gamma_a correlation that stalled the lite run).
#   * log10_gamma_a upper edge widened -7.0 -> -6.0: the lite power-law recovery leaned on the
#     old -7.0 wall (20% of draws within 0.25 dex), so let the OU corner float freely to get an
#     honest posterior and an un-truncated band-amplitude comparison.
# Everything else (absolute paths, FIXED white noise, FREE/hierarchical red noise) is unchanged.

[Data]
# Overwritten per-mode by the SLURM script (data/inject_ou/ or data/inject_powerlaw/).
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/inject_powerlaw/
excluded_psrs = __NONE__

[NUTS]
# Production-grade settings for a converged confirmation (was 200/100/2 in the lite config).
num_samples = 1000
num_warmup = 1000
num_chains = 4
target_accept_prob = 0.90
max_tree_depth = 10
dense_mass = true

[PriorModel]

# 1. GW background parameters
log10_ha_fixed = false
log10_ha_value = -14.35
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = false
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
# Widened above the band (was -7.0) so the OU corner is not truncated by the prior.
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via NG15 per-pulsar noise JSON -- matches the injected values)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_confirm_powerlaw
base_dir = {output_id}
