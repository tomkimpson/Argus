# NG15 SGWB Stage-2 FIXED-gamma_a validation config (T2.4 follow-up).
#
# The free-gamma_a power-law->OU gate has a PATHOLOGICAL posterior even at hi-res
# (r_hat 1.05, ESS 51, 50 divergences): the OU band power depends on the product
# h_a^2 * gamma_a (f^-4 regime), so (h_a, gamma_a) trade along a curved ridge NUTS
# cannot traverse cleanly. FIXING gamma_a collapses that ridge to a single well-
# conditioned scale (h_a). Physically legitimate: the OU corner (mean-reversion
# timescale) is not identifiable here, and the band-referenced amplitude S_r(f*) is
# INVARIANT to the fixed gamma_a as long as the corner sits at/below the band (whole
# band in the f^-4 regime) -- the same simplification used for OU spin-down noise.
#
# This config FIXES gamma_a; slurm_scripts/ng15_fixg_sweep.sh sweeps the value over
# {-8.5, -8.0, -7.8} on the power-law-injected data to demonstrate (a) the pathology
# is gone and (b) the recovered band amplitude is invariant across the three choices.
# gamma_a corners: -8.5 -> tau_c~10yr (below band); -7.8 -> corner ~ 1/T (band bottom).

[Data]
data_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/inject_powerlaw/
excluded_psrs = __NONE__

[NUTS]
# Moderate settings: with the gamma_a ridge removed this converges easily. target_accept
# kept at 0.90 (== the confirm run) so a 50->0 divergence drop cleanly isolates the ridge.
num_samples = 1000
num_warmup = 500
num_chains = 2
target_accept_prob = 0.90
max_tree_depth = 10
dense_mass = true

[PriorModel]

# 1. GW background parameters -- gamma_a FIXED (value overwritten per-sweep by the SLURM script).
log10_ha_fixed = false
log10_ha_value = -13.5
log10_ha_min = -17.0
log10_ha_max = -11.0

log10_gamma_a_fixed = true
log10_gamma_a_value = -8.5
log10_gamma_a_min = -10.5
log10_gamma_a_max = -6.0

# 2. Pulsar red noise parameters (FREE / hierarchical -- empty spin_injections_path)
spin_injections_path =

log10_gamma_p_min = -10.0
log10_gamma_p_max = -7.0
log10_sigma_p_min = -18.0
log10_sigma_p_max = -14.0

log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# 3. EFAC/EQUAD parameters (FIXED via NG15 per-pulsar noise JSON -- matches the injected values)
noise_params_path = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/data/ng15_psr_noise.json

efac_min = 0.5
efac_max = 2.0
log10_equad_min = -8.0
log10_equad_max = -6.0

[Logging]
level = INFO
enable_file_logging = false

[Output]
output_dir = /home/tkimpson/.treehouse/Argus-891104/1/Argus/workflows/ng15_sgwb_demo/outputs/
output_id = ng15_fixg_powerlaw
base_dir = {output_id}
