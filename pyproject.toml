[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.0.0-dev"
description = "Bayesian inference for pulsar timing array data analysis using JAX and Kalman filtering"
authors = [
    { name = "Tom Kimpson", email = "tomkimpson@gmail.com" },
    { name = "J. Hu" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["pulsar", "timing", "bayesian", "inference", "jax", "kalman", "gravitational-waves"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.21.2",
    "pandas>=2.2.3",
    "fastparquet>=2024.11.0",
    "tqdm>=4.67.1",
    "jax[cuda12]>=0.4.35,<0.5.0",
    "numpyro>=0.15.0",
    "matplotlib>=3.7.0",
    "arviz>=0.18.0",
    "corner>=2.2.0",
    "flax>=0.8.0",
    "tensorflow-probability>=0.24.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-autorefs>=1.0",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "markdown-katex>=202112.1034",
]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "pytest-cookies>=0",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0",
    "mypy>=1",
    "pre-commit>=3",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]