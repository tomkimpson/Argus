[project]
name = "argus-pta"
version = "0.0.0-dev" # Just a place holder; package version is managed by the dynamic-versioning plugin & git tags
description = "Bayesian inference for pulsar timing array data analysis using JAX and Kalman filtering"
authors = [
    { name = "Tom Kimpson", email = "tom.kimpson@example.com" },
    { name = "J. Hu", email = "j.hu@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["pulsar", "timing", "bayesian", "inference", "jax", "kalman", "gravitational-waves"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.13"
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/tomkimpson/Argus"
documentation = "https://tomkimpson.github.io/Argus/"
repository = "https://github.com/tomkimpson/Argus"


# Package source location for setuptools
[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-dir]
"" = "python"

# This configures setuptools_scm for dynamic versioning via git tags
[tool.setuptools_scm]
write_to = "python/argus/_version.py"

[tool.pytest.ini_options]
addopts = "--cov"
pythonpath = "./python" # relative to root directory
testpaths = [
    "test", #only test the test directory
]
markers = [
    "gpu: mark test as requiring a GPU",
]

# Uncomment and edit the following line to add custom markers to your tests
# These can be run with the following (for example):
#
#   $ pytest -m marker_name
#
#markers = [ "marker_name: A short description of the marker" ]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/python"

[tool.coverage.paths]
source = ["python"]

[tool.coverage.run]
branch = true
source = ["python"]
omit = ["python/argus/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:"
]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
