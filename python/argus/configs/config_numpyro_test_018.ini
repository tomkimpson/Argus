[Data]
# Path to the data directory
data_path = ../../data/IPTA_MockDataChallenge2/dataset_2b/ 
# Comma-separated list of pulsars to exclude from analysis
excluded_psrs = J1640+2224
# Path to the noise parameters JSON file
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json
# Path to the spin injections pickle file
spin_injections_path = ../../notebooks/approximate_spin_injections.pkl

[Inference]
# Inference method: 'jaxns' for nested sampling or 'numpyro' for NUTS
method = numpyro


[PriorModel]
# GW background parameters
# For each parameter, specify whether to use a fixed value or sample from a range
# If fixed=true, use the *_value parameter
# If fixed=false, use the *_min and *_max parameters
log10_ha_fixed = false
log10_ha_value = -15.0
log10_ha_min = -16.0
log10_ha_max = -14.0

gamma_a_fixed = true
gamma_a_value = 1e-9

# NEW INDIVIDUAL PARAMETER CONTROL FOR PULSAR RED NOISE
# gamma_p can now be controlled independently from sigma_p

# Pulsar red noise frequency parameter (gamma_p) - FIXED
log10_gamma_p_fixed = true
log10_gamma_p_value = injected  # Options: "injected", "default", or a float like -8.0
log10_gamma_p_min = -11.0       # Used when fixed=false
log10_gamma_p_max = -6.0

# Alternative: Fix gamma_p to a specific value for all pulsars
# log10_gamma_p_value = -8.0  # Uncomment to use fixed value instead of injected

# Pulsar red noise amplitude parameter (sigma_p) - FREE 
log10_sigma_p_fixed = false  # Free parameter - this is what you wanted!
log10_sigma_p_min = -18.0
log10_sigma_p_max = -12.0

# Alternative sigma_p options (currently not used since sigma_p is free):
# log10_sigma_p_fixed = true
# log10_sigma_p_value = injected  # Could also use "injected", "default", or a float

# Legacy parameter - deprecated but kept for backwards compatibility
# psr_noise_fixed = false  # Not used when individual controls are specified

# Hierarchical modeling settings
# Since gamma_p is fixed, hierarchical_noise is not applicable
hierarchical_noise = false

# Do not use traditional hierarchical modeling for sigma_p since it's free with uniform prior
hierarchical_sigma_p = false

# Log-ratio parameterization not used since we want independent control
log_ratio_parameterization = false

# EFAC and EQUAD parameters
efac_equad_fixed = true
# If fixed=false, these ranges will be used for sampling
efac_min = 1.0
efac_max = 2.0
equad_min = 0.0
equad_max = 1e-6

[NestedSampling]
# Number of live points for nested sampling
num_live_points = 100
# Termination condition for nested sampling (dlogZ)
dlogZ = 0.1
# Whether to actually run nested sampling (set to false for testing)
run_sampling = false

[NUTS]
# Number of MCMC samples to draw (after warmup) - reduced for testing optimizations
num_samples = 500
# Number of warmup samples for adaptation - reduced for testing optimizations
num_warmup = 500
# Number of parallel chains
num_chains = 2
# Target acceptance probability for NUTS - optimized for efficiency vs accuracy tradeoff
target_accept_prob = 0.85
# Maximum tree depth - conservative to prevent runaway trajectories
max_tree_depth = 10
# Initial step size (optional - let NUTS adapt if not specified)
# step_size = 0.01
# Enable dense mass matrix for better parameter correlation handling
dense_mass = true

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to save detailed timing information
save_timing = true

[Output]
# Optional ID for output directory. If not provided or empty, timestamp will be used.
output_id = numpyro_test_018
# Base directory for output files, {timestamp} or {output_id} will be replaced appropriately
base_dir = {output_id}