[Data]
# Path to the data directory
data_path = ../../data/IPTA_MockDataChallenge2/dataset_2b/ 
# Comma-separated list of pulsars to exclude from analysis
excluded_psrs = J1640+2224
# Path to the noise parameters JSON file
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json
# Path to the spin injections pickle file
spin_injections_path = ../../notebooks/approximate_spin_injections.pkl

[Inference]
# Inference method: 'jaxns' for nested sampling or 'numpyro' for NUTS
method = numpyro


[PriorModel]
# GW background parameters
# For each parameter, specify whether to use a fixed value or sample from a range
# If fixed=true, use the *_value parameter
# If fixed=false, use the *_min and *_max parameters
log10_ha_fixed = false
log10_ha_value = -15.0
log10_ha_min = -18.0
log10_ha_max = -14.0

# Updated to use log10_gamma_a instead of gamma_a
log10_gamma_a_fixed = false
log10_gamma_a_value = -9.0
log10_gamma_a_min = -10.0
log10_gamma_a_max = -8.0

# Pulsar red noise parameters
psr_noise_fixed = false
# If fixed=false, these ranges will be used for sampling

log10_gamma_p_min = -11.0
log10_gamma_p_max = -6.0

# Log-ratio parameterization test: σp derived from γp + ratio
log10_sigma_p_fixed = false
log10_sigma_p_min = -20.0
log10_sigma_p_max = -12.0

# Hierarchical modeling for gamma_p (as in run 015)
hierarchical_noise = true
# Hyperprior ranges for hierarchical modeling of gamma_p
log10_gamma_p_mean_min = -9.0
log10_gamma_p_mean_max = -7.0
log10_gamma_p_std_min = 0.1
log10_gamma_p_std_max = 1.0

# Do not use traditional hierarchical modeling for sigma_p
hierarchical_sigma_p = false

# Enable log-ratio parameterization for sigma_p
log_ratio_parameterization = true
# log10(σp) = log10(γp) + log10(ratio)
# Expected range: if γp ~ -8, ratio ~ -6 to -6 gives σp ~ -14 to -14
# But allow broader range to be safe
log10_ratio_mean_min = -8.0
log10_ratio_mean_max = -4.0
log10_ratio_std_min = 0.5
log10_ratio_std_max = 3.0

# EFAC and EQUAD parameters - NOW FREE PARAMETERS
efac_equad_fixed = false
# EFAC uniform prior
efac_min = 0.1
efac_max = 3.0
# EQUAD log10 prior: log10(EQUAD) ~ U(-9, -5)
equad_log10_prior = true
log10_equad_min = -9.0
log10_equad_max = -5.0

[NestedSampling]
# Number of live points for nested sampling
num_live_points = 100
# Termination condition for nested sampling (dlogZ)
dlogZ = 0.1
# Whether to actually run nested sampling (set to false for testing)
run_sampling = false

[NUTS]
# Number of MCMC samples to draw (after warmup) - increased for run 022
num_samples = 2000
# Number of warmup samples for adaptation - increased for run 022
num_warmup = 1000
# Number of parallel chains - increased to 4 for run 022
num_chains = 4
# Target acceptance probability for NUTS - optimized for efficiency vs accuracy tradeoff
target_accept_prob = 0.85
# Maximum tree depth - conservative to prevent runaway trajectories
max_tree_depth = 10
# Initial step size (optional - let NUTS adapt if not specified)
# step_size = 0.01
# Enable dense mass matrix for better parameter correlation handling
dense_mass = true

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to save detailed timing information
save_timing = true

[Output]
# Optional ID for output directory. If not provided or empty, timestamp will be used.
output_id = numpyro_test_027
# Base directory for output files, {timestamp} or {output_id} will be replaced appropriately
base_dir = {output_id}