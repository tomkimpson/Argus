[Data]
# Path to the data directory
data_path = ../../data/IPTA_MockDataChallenge2/dataset_2b/
# Comma-separated list of pulsars to exclude from analysis
excluded_psrs = J1640+2224
# Path to the noise parameters JSON file
noise_params_path = ../../data/IPTA_MockDataChallenge2/group1_psr_noise.json
# Path to the spin injections pickle file
spin_injections_path = ../../notebooks/approximate_spin_injections.pkl

[Inference]
# Inference method: Must use 'numpyro' for spike-and-slab method
method = numpyro

[PriorModel]
# Spike-and-slab specific settings - ENABLE SPIKE-AND-SLAB PRIOR
spike_slab_method = true
# Spike probability: prior probability that ha = 0 (no GW signal)
spike_prob = 0.5

# GW background parameters 
# For spike-and-slab test: ha is the only free parameter (spike-and-slab)
# Slab component uses uniform prior in log10 space with reparameterization
log10_ha_fixed = false
log10_ha_min = -18.0
log10_ha_max = -14.0

# Fix gamma_a at injected/true value for one-parameter test
log10_gamma_a_fixed = true
log10_gamma_a_value = -9.0

# Pulsar red noise parameters - FIXED AT INJECTED VALUES for one-parameter test
psr_noise_fixed = true

# EFAC and EQUAD parameters - FIXED AT INJECTED VALUES for one-parameter test
efac_equad_fixed = true

[NUTS]
# NUTS parameters optimized for spike-and-slab sampling
# Increased samples for better posterior characterization
num_samples = 4000
num_warmup = 2000
# Multiple chains for convergence diagnostics
num_chains = 2
# Conservative acceptance probability for discrete/continuous mixture
target_accept_prob = 0.8
# Reasonable tree depth
max_tree_depth = 10
# Use dense mass matrix for parameter correlations
dense_mass = true

[Logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO
# Whether to save detailed timing information
save_timing = true

[Output]
# Output ID for this spike-and-slab test
output_id = spike_slab_test_001
# Base directory for output files
base_dir = {output_id}

[NestedSampling]
# Not used for spike-and-slab method (NUTS only)
# Keep for config compatibility
num_live_points = 100
dlogZ = 0.1
run_sampling = false